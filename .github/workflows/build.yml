name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          persist-credentials: false

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nasm qemu-system-x86

      - name: Build and run local CI checks
        run: make ci-check

      - name: Report sizes
        if: ${{ (success() || failure()) && hashFiles('build/kernel.bin') != '' }}
        run: make size-report

      - name: Generate image checksums
        if: ${{ (success() || failure()) && hashFiles('build/llmos.img') != '' }}
        run: make image-checksums

      - name: Upload image
        if: ${{ (success() || failure()) && hashFiles('build/llmos.img') != '' }}
        id: upload-image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: llmos.img
          path: |
            build/llmos.img
            build/SHA256SUMS

      - name: Download uploaded image artifact
        if: ${{ steps.upload-image.outcome == 'success' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: llmos.img
          path: build-artifact-check

      - name: Verify uploaded image checksum
        if: ${{ steps.upload-image.outcome == 'success' }}
        run: |
          test -f build-artifact-check/llmos.img
          test -f build-artifact-check/SHA256SUMS
          (cd build-artifact-check && sha256sum -c SHA256SUMS)
